<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경기지역본부 업무대체 관리방</title>
    
    <!-- CDN 라이브러리 불러오기 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/prop-types/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="background-color: #121418; margin: 0; padding: 0;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { BarChart, Bar, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

        // 로컬스토리지 저장 키 (필요 시 수정 내역 저장용)
        const RECORDS_KEY = "substitution-records";
        const ROSTER_KEY = "substitution-roster";

        function App() {
            const [records, setRecords] = useState([]);
            const [roster, setRoster] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [selectedDate, setSelectedDate] = useState("");

            // 💡 data.json 파일 실시간 자동 로드
            useEffect(() => {
                fetch('./data.json?t=' + new Date().getTime())
                    .then((res) => {
                        if (!res.ok) throw new Error("파일을 찾을 수 없습니다.");
                        return res.json();
                    })
                    .then((data) => {
                        if (data.records && data.records.length > 0) {
                            setRecords(data.records);
                            // 가장 최근 날짜를 기본 선택
                            setSelectedDate(data.records[data.records.length - 1].date);
                        }
                        if (data.roster) {
                            setRoster(data.roster);
                        }
                        setIsLoading(false);
                    })
                    .catch((err) => {
                        console.error("data.json 로드 실패:", err);
                        // 실패 시 로컬스토리지 백업 데이터 확인
                        const savedRecords = localStorage.getItem(RECORDS_KEY);
                        if (savedRecords) setRecords(JSON.parse(savedRecords));
                        setIsLoading(false);
                    });
            }, []);

            // 로딩 화면 표시
            if (isLoading) {
                return (
                    <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', height: '100vh', color: '#ffffff' }}>
                        <p style={{ fontSize: '18px', fontWeight: 'bold' }}>데이터를 불러오는 중입니다...</p>
                    </div>
                );
            }

            return (
                <div style={{ minHeight: '100vh', padding: '20px', color: '#ffffff' }}>
                    <header style={{ marginBottom: '20px', borderBottom: '1px solid #333', paddingBottom: '10px' }}>
                        <h1 style={{ fontSize: '24px', fontWeight: 'bold' }}>경기지역본부 업무대체 관리방</h1>
                        <p style={{ color: '#aaa', fontSize: '14px' }}>
                            총 등록 기록: {records.length}건 | 명단 수: {roster.length}명
                        </p>
                    </header>

                    <main>
                        {/* 주요 데이터 목록 표시 */}
                        <div style={{ background: '#1e222b', padding: '15px', borderRadius: '8px' }}>
                            <h2 style={{ fontSize: '18px', marginBottom: '10px' }}>최근 대체근무 기록</h2>
                            <ul>
                                {records.slice(-10).reverse().map((item) => (
                                    <li key={item.id} style={{ padding: '8px 0', borderBottom: '1px solid #2a2f3d' }}>
                                        <span style={{ color: '#4ADE80', marginRight: '10px' }}>[{item.date}]</span>
                                        <strong>{item.requester}</strong> → {item.substitute} ({item.workDetails})
                                    </li>
                                ))}
                            </ul>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
